<title>SkyGuard — Sensor Belief</title>
<style>
:root{
  --paper:#FFFFFF; --surface:#F8F7F7; --ink:#1F1A1C; --ink-2:#4F464A; --ink-3:#867B7F;
  --rule:#E2DCDE; --rule-soft:#F0ECEE;
  --accent:#7A3B52; --accent-bg:#F6EBEF;
  --ok:#1D6A46; --ok-bg:#E6F1EB;
  --sus:#8F6212; --sus-bg:#FAF0DC;
  --bad:#B03A30; --bad-bg:#FBE9E6;
  --f-body:"Karla","Segoe UI",system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
     font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(1rem,3vw,2.5rem);
      display:flex;flex-direction:column;gap:1.8rem}
h1{font-size:1.55rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.02rem;margin:0 0 .55rem;letter-spacing:-.005em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.dim{color:var(--ink-3)}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.13em;
         text-transform:uppercase;color:var(--accent)}

header{border-bottom:2px solid var(--accent);padding-bottom:1rem;
       display:flex;flex-direction:column;gap:.45rem}
.sub{color:var(--ink-2);font-size:.95rem;max-width:70ch}

.warn{border-left:3px solid var(--sus);background:var(--sus-bg);
      padding:.8rem 1rem;font-size:.9rem;color:var(--ink-2)}
.warn b{color:var(--ink)}

section{border:1px solid var(--rule);background:var(--surface)}
.head{padding:.7rem 1rem;border-bottom:1px solid var(--rule);
      display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline}
.body{padding:1rem}

/* sensor cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:.7rem}
.card{border:1px solid var(--rule);background:var(--paper);padding:.75rem .85rem}
.card.hk{border-color:var(--accent);border-width:2px}
.card h3{margin:0 0 .15rem;font-size:.86rem;font-weight:600}
.card .tag{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;
           text-transform:uppercase;padding:.1rem .35rem;border-radius:2px}
.tag.hk{background:var(--accent-bg);color:var(--accent)}
.tag.named{background:var(--bad-bg);color:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:.6rem;font-size:.82rem;
    padding:.16rem 0;border-bottom:1px solid var(--rule-soft)}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-family:var(--f-mono);color:var(--ink)}
.trustbar{height:5px;background:var(--rule);margin-top:.45rem;overflow:hidden}
.trustbar i{display:block;height:100%}

/* checker panel */
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
   color:var(--ink-3);text-align:left;padding:.5rem .6rem;border-bottom:1.5px solid var(--rule)}
td{padding:.5rem .6rem;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.fired{background:var(--bad-bg)}
td.num{font-family:var(--f-mono);white-space:nowrap;text-align:right}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.62rem;font-weight:700;
      letter-spacing:.06em;padding:.15rem .45rem;border-radius:2px}
.pill.fired{background:var(--bad-bg);color:var(--bad)}
.pill.quiet{background:var(--rule-soft);color:var(--ink-3)}
.pill.alarm{background:var(--bad-bg);color:var(--bad)}
.pill.unknown{background:var(--sus-bg);color:var(--sus)}
.pill.pass{background:var(--ok-bg);color:var(--ok)}

.verdict{margin-top:.8rem;padding:.7rem .9rem;border-left:3px solid var(--sus);
         background:var(--sus-bg);font-size:.9rem}

/* charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;font-size:.76rem;color:var(--ink-3);
        margin-top:.35rem}
.legend i{display:inline-block;width:16px;height:2.5px;vertical-align:middle;margin-right:.3rem}

footer{font-size:.82rem;color:var(--ink-3);border-top:1px solid var(--rule);
       padding-top:1rem;max-width:75ch}
@media(max-width:620px){.cards{grid-template-columns:1fr}}
</style>

<div class="wrap" id="app"><p class="dim">loading…</p></div>

<script>
const DATA = /*__DATA__*/null;

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = (v, d=2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);

function trustColour(t){
  if (t >= 0.85) return "var(--ok)";
  if (t >= 0.6)  return "var(--sus)";
  return "var(--bad)";
}

/* A small sparkline. Two series on one axis: the belief's bias, and a shaded
   band marking the interval a human recorded as faulty. The point of the chart
   is the RELATIONSHIP between those two, so the fault band is drawn first and
   the line on top of it. */
function spark(points, key, w=1040, h=118){
  const pad = {l:46, r:10, t:8, b:18};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const vals = points.map(p => p[key]).filter(v => v !== null && !Number.isNaN(v));
  if (!vals.length) return `<p class="dim">no data</p>`;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-9){ hi += 0.5; lo -= 0.5; }
  const padY = (hi - lo) * 0.12; lo -= padY; hi += padY;
  const X = i => pad.l + (i / Math.max(points.length - 1, 1)) * iw;
  const Y = v => pad.t + ih - ((v - lo) / (hi - lo)) * ih;

  // contiguous faulty runs become shaded bands
  let bands = "", start = null;
  points.forEach((p, i) => {
    if (p.faulty && start === null) start = i;
    if ((!p.faulty || i === points.length - 1) && start !== null){
      bands += `<rect x="${X(start).toFixed(1)}" y="${pad.t}" width="${Math.max(X(i)-X(start),1).toFixed(1)}" height="${ih}" fill="var(--bad-bg)"></rect>`;
      start = null;
    }
  });

  let d = "", pen = false;
  points.forEach((p, i) => {
    const v = p[key];
    if (v === null || Number.isNaN(v)){ pen = false; return; }
    d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;
    pen = true;
  });

  const zeroY = (lo <= 0 && hi >= 0) ? Y(0) : null;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${esc(key)} over time with the human-recorded fault interval shaded">
    ${bands}
    ${zeroY !== null ? `<line x1="${pad.l}" y1="${zeroY.toFixed(1)}" x2="${w-pad.r}" y2="${zeroY.toFixed(1)}" stroke="var(--rule)" stroke-width="1"></line>` : ""}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"></path>
    <text x="4" y="${(pad.t+8).toFixed(1)}" font-size="10" fill="var(--ink-3)" font-family="var(--f-mono)">${fmt(hi)}</text>
    <text x="4" y="${(pad.t+ih).toFixed(1)}" font-size="10" fill="var(--ink-3)" font-family="var(--f-mono)">${fmt(lo)}</text>
  </svg>`;
}

function sensorCard(k, s){
  const dts = s.days_to_spec;
  return `<div class="card ${s.housekeeping ? "hk" : ""}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.4rem">
      <h3>${esc(s.label)}</h3>
      ${s.housekeeping ? `<span class="tag hk">hardware</span>` : ""}
      ${s.named_in_report ? `<span class="tag named">in report</span>` : ""}
    </div>
    <div class="kv"><span>bias</span><span>${fmt(s.bias)} <span class="dim">(${fmt(s.bias_lo)} … ${fmt(s.bias_hi)})</span></span></div>
    <div class="kv"><span>drift / day</span><span>${fmt(s.drift_per_day,4)}</span></div>
    <div class="kv"><span>noise scale</span><span>${fmt(s.noise)}</span></div>
    <div class="kv"><span>days to spec</span><span>${dts === null ? '<span class="dim">not resolvable</span>' : fmt(dts,0)}</span></div>
    <div class="kv"><span>trust</span><span style="color:${trustColour(s.trust)}">${fmt(s.trust)}</span></div>
    <div class="trustbar"><i style="width:${(s.trust*100).toFixed(0)}%;background:${trustColour(s.trust)}"></i></div>
    <p class="dim" style="font-size:.75rem;margin-top:.35rem">${esc(s.checks)}</p>
  </div>`;
}

function render(d){
  const dq = d.dqr;
  const pill = {alarm:"alarm", unknown:"unknown", pass:"pass"}[d.panel.decision] || "unknown";

  const cards = Object.entries(d.sensors).map(([k,s]) => sensorCard(k,s)).join("");

  const rows = d.panel.verdicts.map(v => `<tr class="${v.fired ? "fired" : ""}">
      <td><span class="pill ${v.fired ? "fired" : "quiet"}">${v.fired ? "FIRED" : "quiet"}</span></td>
      <td class="mono">${esc(v.checker)}</td>
      <td class="num">${v.score >= 0 ? "+" : ""}${fmt(v.score,2)}</td>
      <td>${esc(v.reason)}</td>
    </tr>`).join("");

  // the belief series for whichever sensors the report actually named, plus
  // any housekeeping channel, since that is the independent evidence
  const show = Object.entries(d.sensors)
    .filter(([k,s]) => s.named_in_report || s.housekeeping)
    .slice(0,4);

  const charts = show.map(([k,s]) => `
    <div style="margin-bottom:1.1rem">
      <p class="eyebrow">${esc(s.label)} — accumulated bias</p>
      ${spark(d.series[k] || [], "bias")}
      <div class="legend">
        <span><i style="background:var(--accent)"></i>belief bias</span>
        <span><i style="background:var(--bad-bg);height:9px"></i>interval a human recorded as faulty</span>
      </div>
    </div>`).join("");

  document.getElementById("app").innerHTML = `
    <header>
      <span class="eyebrow">SkyGuard · sensor belief · real ARM instrument</span>
      <h1>${esc(d.station)} — ${esc(dq.subject)}</h1>
      <p class="sub">Data Quality Report <span class="mono">${esc(dq.id)}</span>, written by a person who inspected the instrument.
      ${esc(dq.start.slice(0,16).replace("T"," "))} to ${esc(dq.end.slice(0,16).replace("T"," "))} — ${fmt(dq.hours,0)} hours.
      Variables named in the report: <span class="mono">${esc(dq.variables)}</span>.</p>
    </header>

    <div class="warn"><b>Read this before the numbers.</b> ${esc(d.reference.warning)}</div>

    <section>
      <div class="head"><h2>What the system believes about each sensor</h2>
        <span class="dim" style="font-size:.82rem">bias, drift and trust are carried across time, not recomputed per reading</span></div>
      <div class="body"><div class="cards">${cards}</div></div>
    </section>

    <section>
      <div class="head"><h2>Why — the checker panel</h2>
        <span class="dim" style="font-size:.82rem">at ${esc(d.panel.at.slice(0,16).replace("T"," "))}</span>
        <span class="pill ${pill}" style="margin-left:auto">${esc(d.panel.decision.toUpperCase())}</span></div>
      <div class="body">
        <table><thead><tr><th></th><th>checker</th><th style="text-align:right">score σ</th><th>reason</th></tr></thead>
        <tbody>${rows}</tbody></table>
        <div class="verdict"><b>${esc(d.panel.decision.toUpperCase())}</b> — ${esc(d.panel.note || (d.panel.corroborated_by ? "corroborated by " + d.panel.corroborated_by.join(" + ") : ""))}
        <br><br>Each verdict above <em>is</em> the explanation. There is no separate explainer, because the checkers already speak in the operator's vocabulary.</div>
      </div>
    </section>

    <section>
      <div class="head"><h2>Belief over time</h2>
        <span class="dim" style="font-size:.82rem">shaded band is the interval a human recorded as faulty</span></div>
      <div class="body">${charts || '<p class="dim">no series</p>'}</div>
    </section>

    <footer>
      Every number on this page is computed from real one-minute observations by a real instrument,
      over an interval an ARM data-quality analyst recorded as faulty. Nothing here is mock data.
      Where the estimate is weak, it is shown weak — the reference caveat above is the honest state of
      this measurement, not a disclaimer.
    </footer>`;
}

if (DATA) render(DATA);
else document.getElementById("app").innerHTML =
  '<p class="dim">No snapshot. Run <span class="mono">python -m evaluation.export_ai_view</span> then <span class="mono">python -m dashboard.build_ai</span>.</p>';
</script>
