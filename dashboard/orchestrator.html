<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkyGuard — Orchestrator</title>
<style>
:root{
  --paper:#FFFFFF; --surface:#F7F6F6; --surface-2:#FBFAFA;
  --ink:#1E1A1C; --ink-2:#4E4549; --ink-3:#877C80;
  --rule:#E0DADC; --rule-soft:#EFEBED;
  --accent:#7A3B52; --accent-bg:#F6EBEF;
  --ok:#1D6A46; --ok-bg:#E6F1EB;
  --sus:#8A5E11; --sus-bg:#FAF0DA;
  --bad:#AF382F; --bad-bg:#FBE8E5;
  --mono:ui-monospace,"Roboto Mono",Consolas,monospace;
  --sans:"Karla","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased}
.bar{display:flex;flex-wrap:wrap;gap:.7rem 1rem;align-items:flex-end;
     padding:.9rem 1.2rem;border-bottom:2px solid var(--accent);background:var(--surface-2)}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:.4rem}
.brand small{display:block;font:400 .66rem/1.3 var(--mono);letter-spacing:.12em;
             text-transform:uppercase;color:var(--accent)}
label{display:block;font:600 .64rem/1.4 var(--mono);letter-spacing:.1em;
      text-transform:uppercase;color:var(--ink-3);margin-bottom:.2rem}
select,button{font:inherit;padding:.42rem .6rem;border:1px solid var(--rule);
              background:var(--paper);color:var(--ink);border-radius:3px}
select{min-width:230px;max-width:min(46vw,520px)}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
      gap:1rem;padding:1rem 1.2rem;align-items:start}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
.panel{border:1px solid var(--rule);background:var(--surface)}
.panel>h2{margin:0;padding:.6rem .85rem;border-bottom:1px solid var(--rule);
          font:600 .82rem/1.3 var(--sans);display:flex;gap:.6rem;align-items:center}
.panel>h2 .sub{font:400 .72rem/1.3 var(--sans);color:var(--ink-3);margin-left:auto}
.pad{padding:.85rem}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-3)}
.warn{border-left:3px solid var(--sus);background:var(--sus-bg);padding:.6rem .8rem;
      font-size:.84rem;color:var(--ink-2);margin:.7rem 1.2rem 0}

/* timeline */
.tl{position:relative;height:44px;border:1px solid var(--rule);background:var(--paper);
    cursor:pointer;overflow:hidden}
.tl .band{position:absolute;top:0;bottom:0;background:var(--bad-bg)}
.tl .nod{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(
   45deg,transparent,transparent 3px,var(--rule-soft) 3px,var(--rule-soft) 6px)}
.tl .cur{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.tl svg{position:absolute;inset:0;width:100%;height:100%}
.tlrow{display:flex;gap:.5rem;align-items:center;margin-top:.5rem;flex-wrap:wrap}
.tlrow .mono{font-size:.8rem}

/* checkers */
.chk{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;
     border:1px solid var(--rule-soft);background:var(--paper);margin-bottom:.4rem;
     opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
.chk.in{opacity:1;transform:none}
.chk.fired{border-color:var(--bad);background:var(--bad-bg)}
.chk .nm{font-family:var(--mono);font-size:.82rem;min-width:92px;font-weight:600}
.chk .sc{font-family:var(--mono);font-size:.82rem;min-width:52px;text-align:right}
.chk .rs{font-size:.84rem;color:var(--ink-2);flex:1}
.tick{width:15px;height:15px;border-radius:50%;flex:none;margin-top:3px;
      border:2px solid var(--rule);background:var(--paper)}
.tick.on{border-color:var(--bad);background:var(--bad)}
.tick.off{border-color:var(--ok);background:var(--ok)}
.tick.run{border-color:var(--accent);border-right-color:transparent;
          animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.verdict{margin-top:.6rem;padding:.7rem .8rem;font-size:.9rem;border-left:3px solid}
.verdict.alarm{border-color:var(--bad);background:var(--bad-bg)}
.verdict.unknown{border-color:var(--sus);background:var(--sus-bg)}
.verdict.pass{border-color:var(--ok);background:var(--ok-bg)}
.verdict b{display:block;font-family:var(--mono);letter-spacing:.06em;margin-bottom:.2rem}

/* belief */
.bcard{border:1px solid var(--rule-soft);background:var(--paper);padding:.55rem .65rem;
       margin-bottom:.45rem}
.bcard.hk{border-color:var(--accent)}
.bhead{display:flex;gap:.5rem;align-items:baseline;margin-bottom:.25rem}
.bhead .t{font-weight:600;font-size:.85rem}
.chip{font:700 .58rem/1.5 var(--mono);letter-spacing:.07em;padding:.05rem .32rem;
      border-radius:2px;text-transform:uppercase}
.chip.hk{background:var(--accent-bg);color:var(--accent)}
.chip.named{background:var(--bad-bg);color:var(--bad)}
.kv{display:flex;justify-content:space-between;font-size:.78rem;padding:.1rem 0}
.kv b{font-family:var(--mono);font-weight:400}
.tbar{height:4px;background:var(--rule);margin-top:.3rem}
.tbar i{display:block;height:100%}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">SkyGuard<small>orchestrator</small></div>
  <div><label for="st">Station</label><select id="st"></select></div>
  <div><label for="wd">Fault window — from ARM data-quality reports</label><select id="wd"></select></div>
  <div><label>&nbsp;</label><button id="run" class="primary">Run orchestrator</button></div>
  <div><label>&nbsp;</label><button id="play">Step through ▶</button></div>
  <div class="dim mono" id="stat" style="font-size:.78rem;padding-bottom:.5rem"></div>
</div>

<div class="warn" id="ref"></div>

<div class="grid">
  <div style="display:flex;flex-direction:column;gap:1rem;min-width:0">
    <div class="panel">
      <h2>Timeline<span class="sub" id="tlsub"></span></h2>
      <div class="pad">
        <div class="tl" id="tl"><div class="cur" id="cur" style="left:0"></div></div>
        <div class="tlrow">
          <button id="prev">◀</button><button id="next">▶</button>
          <span class="mono" id="when">—</span>
          <span class="dim" style="font-size:.78rem;margin-left:auto">
            shaded = interval a person recorded as faulty · hatched = station not reporting</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Checkers<span class="sub" id="csub">idle</span></h2>
      <div class="pad"><div id="chks"></div><div id="verd"></div></div>
    </div>
  </div>

  <div class="panel" style="min-width:0">
    <h2>What the system believes<span class="sub">carried across time, not recomputed</span></h2>
    <div class="pad" id="bel"><p class="dim">Run the orchestrator to populate.</p></div>
  </div>
</div>

<script>
const API = location.origin;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const f = (v,d=2) => (v===null||v===undefined||Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let CAT = null, REPLAY = null, IDX = 0, PLAYING = false;

function trustColour(t){ return t>=.85 ? "var(--ok)" : t>=.6 ? "var(--sus)" : "var(--bad)"; }

async function boot(){
  $("stat").textContent = "loading catalog…";
  CAT = await (await fetch(`${API}/api/ai/catalog`)).json();
  if (!CAT.stations?.length){ $("stat").textContent = "no ARM data held"; return; }
  $("st").innerHTML = CAT.stations.map(s =>
    `<option value="${esc(s.station)}">${esc(s.station)} — ${s.windows.length} window(s)</option>`).join("");
  $("st").onchange = fillWindows;
  $("wd").onchange = loadReplay;
  await fillWindows();
}

async function fillWindows(){
  const s = CAT.stations.find(x => x.station === $("st").value);
  $("wd").innerHTML = s.windows.map(w =>
    `<option value="${esc(w.dqr)}">${esc(w.subject.slice(0,52))} — ${f(w.hours,0)}h${w.housekeeping_named ? " · housekeeping" : ""}</option>`
  ).join("");
  await loadReplay();
}

async function loadReplay(){
  const st = $("st").value, dqr = $("wd").value;
  if (!st || !dqr) return;
  $("stat").textContent = "loading window…";
  const r = await fetch(`${API}/api/ai/replay?station=${encodeURIComponent(st)}&dqr=${encodeURIComponent(dqr)}`);
  if (!r.ok){ $("stat").textContent = "no data held for that window"; return; }
  REPLAY = await r.json();
  IDX = REPLAY.suggested_index ?? 0;
  $("ref").textContent = REPLAY.reference.warning;
  $("ref").style.display = REPLAY.reference.compromised ? "" : "none";
  $("tlsub").textContent = `${REPLAY.hours.length} hours · ${REPLAY.dqr.hours}h fault`;
  drawTimeline(); syncWhen();
  $("stat").textContent = REPLAY.dqr.subject;
  $("chks").innerHTML = ""; $("verd").innerHTML = "";
  $("csub").textContent = "idle";
}

function drawTimeline(){
  const tl = $("tl"), n = REPLAY.hours.length;
  [...tl.querySelectorAll(".band,.nod,svg")].forEach(e => e.remove());
  const mk = (cls, a, b) => {
    const d = document.createElement("div");
    d.className = cls;
    d.style.left = (100*a/n) + "%"; d.style.width = (100*(b-a)/n) + "%";
    tl.insertBefore(d, $("cur")); };
  let s = null;
  REPLAY.hours.forEach((h,i) => {
    if (h.faulty && s===null) s=i;
    if ((!h.faulty || i===n-1) && s!==null){ mk("band", s, i); s=null; }
  });
  s = null;
  REPLAY.hours.forEach((h,i) => {
    if (!h.has_data && s===null) s=i;
    if ((h.has_data || i===n-1) && s!==null){ mk("nod", s, i); s=null; }
  });
  // trust of the first named sensor, as a shape over the same axis
  const key = Object.keys(REPLAY.series).find(k => REPLAY.series[k].named_in_report)
           || Object.keys(REPLAY.series)[0];
  const tr = REPLAY.series[key]?.trust || [];
  if (tr.length){
    const pts = tr.map((v,i) => v===null ? null : `${(100*i/(n-1)).toFixed(2)},${(100-(v*100)).toFixed(2)}`)
                  .filter(Boolean).join(" ");
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 100 100"); svg.setAttribute("preserveAspectRatio","none");
    svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`;
    tl.insertBefore(svg, $("cur"));
  }
  tl.onclick = e => {
    const r = tl.getBoundingClientRect();
    IDX = Math.max(0, Math.min(n-1, Math.round((e.clientX-r.left)/r.width*(n-1))));
    syncWhen(); run();
  };
}

function syncWhen(){
  if (!REPLAY) return;
  const h = REPLAY.hours[IDX];
  $("cur").style.left = (100*IDX/(REPLAY.hours.length-1)) + "%";
  $("when").textContent = h.t.slice(0,16).replace("T"," ")
    + (h.faulty ? "  · inside the recorded fault" : "  · outside")
    + (h.has_data ? "" : "  · station not reporting");
}

async function run(){
  if (!REPLAY) return;
  const st = REPLAY.station, dqr = REPLAY.dqr.id;
  $("run").disabled = true; $("csub").textContent = "running…";
  const box = $("chks"); box.innerHTML = ""; $("verd").innerHTML = "";

  const res = await (await fetch(
    `${API}/api/ai/evaluate?station=${encodeURIComponent(st)}&dqr=${encodeURIComponent(dqr)}&i=${IDX}`)).json();

  // show each checker arriving, so the sequence is visible rather than a
  // finished verdict appearing all at once
  for (const v of res.verdicts){
    const row = document.createElement("div");
    row.className = "chk";
    row.innerHTML = `<div class="tick run"></div>
      <div class="nm">${esc(v.checker)}</div>
      <div class="sc">…</div><div class="rs dim">evaluating</div>`;
    box.appendChild(row);
    requestAnimationFrame(() => row.classList.add("in"));
    await sleep(160);
    row.querySelector(".tick").className = "tick " + (v.fired ? "on" : "off");
    row.querySelector(".sc").textContent = (v.score>=0?"+":"") + f(v.score);
    row.querySelector(".rs").textContent = v.reason;
    row.querySelector(".rs").classList.remove("dim");
    if (v.fired) row.classList.add("fired");
  }

  await sleep(140);
  $("verd").innerHTML = `<div class="verdict ${esc(res.decision)}">
    <b>${esc(res.decision.toUpperCase())}</b>
    ${esc(res.note || (res.corroborated_by ? "corroborated by " + res.corroborated_by.join(" + ") : ""))}
    <div class="dim" style="margin-top:.4rem;font-size:.82rem">
      Each verdict above <em>is</em> the explanation — the checkers already speak in the operator's vocabulary,
      so nothing needs a separate explainer.</div></div>`;
  $("csub").textContent = "at " + res.t.slice(0,16).replace("T"," ");

  $("bel").innerHTML = Object.entries(res.belief).map(([k,b]) => `
    <div class="bcard ${b.housekeeping ? "hk" : ""}">
      <div class="bhead"><span class="t">${esc(b.label)}</span>
        ${b.housekeeping ? '<span class="chip hk">hardware</span>' : ""}
        <span class="dim mono" style="margin-left:auto;font-size:.78rem">${f(b.value)} ${esc(b.unit)}</span></div>
      <div class="kv"><span>bias</span><b>${f(b.bias)} <span class="dim">(${f(b.bias_lo)}…${f(b.bias_hi)})</span></b></div>
      <div class="kv"><span>drift / day</span><b>${f(b.drift_per_day,4)}</b></div>
      <div class="kv"><span>days to spec</span><b>${b.days_to_spec===null ? '<span class="dim">not resolvable</span>' : f(b.days_to_spec,0)}</b></div>
      <div class="kv"><span>trust</span><b style="color:${trustColour(b.trust)}">${f(b.trust)}</b></div>
      <div class="tbar"><i style="width:${(b.trust*100).toFixed(0)}%;background:${trustColour(b.trust)}"></i></div>
      <div class="dim" style="font-size:.74rem;margin-top:.25rem">${esc(b.checks)}</div>
    </div>`).join("");

  $("run").disabled = false;
}

$("run").onclick = run;
$("prev").onclick = () => { IDX = Math.max(0, IDX-1); syncWhen(); run(); };
$("next").onclick = () => { IDX = Math.min(REPLAY.hours.length-1, IDX+1); syncWhen(); run(); };
$("play").onclick = async () => {
  if (PLAYING){ PLAYING = false; $("play").textContent = "Step through ▶"; return; }
  PLAYING = true; $("play").textContent = "Stop ■";
  while (PLAYING && IDX < REPLAY.hours.length-1){
    IDX += 1; syncWhen(); await run(); await sleep(220);
  }
  PLAYING = false; $("play").textContent = "Step through ▶";
};

boot().then(() => { if (REPLAY) run(); });
</script>
</body>
</html>
