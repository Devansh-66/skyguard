<title>SkyGuard Station Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">

<style>
/*__LEAFLET_CSS__*/
:root{
  /* Aligned to the React app's chart-paper palette (web/src/styles/tokens.css).
     The VARIABLE NAMES are unchanged on purpose: every rule below keeps working
     and not one layout declaration is touched -- only the values move, so this
     page matches the rest of the product without being redesigned.

     Warm recorder stock, ink pen, oxide reserved for out-of-tolerance. */
  --ground:#F7F2E7; --surface:#FCF9F2; --surface-2:#F1EADB; --line:#DDD3C0;
  --rule:#EDE4D2;
  --ink:#171A1E; --ink-2:#4A4038; --ink-3:#877B6C;
  --accent:#2C5D4F; --accent-soft:#E6EEE9;
  --ok:#2C5D4F; --watch:#8A6212; --degrade:#B4621B; --suspect:#A2361F; --failed:#6E1B10;
  --trace:#171A1E; --trace-2:#BFB4A0; --band:rgba(162,54,31,.14);
  --shadow:0 1px 2px rgba(60,44,34,.06),0 10px 26px -18px rgba(60,44,34,.30);
}


*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Archivo","Segoe UI",system-ui,sans-serif; margin:0; text-wrap:balance}
.mono{font-family:"Roboto Mono",ui-monospace,Consolas,monospace; font-variant-numeric:tabular-nums}
.lbl{
  font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-size:10.5px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
}

/* ---------------------------------------------------------------- masthead */
header{
  border-bottom:1px solid var(--line); background:var(--surface);
  padding:16px 22px; display:flex; flex-wrap:wrap; gap:18px; align-items:baseline;
}
header h1{font-size:19px; font-weight:700; letter-spacing:-.01em}
header .sub{color:var(--ink-2); font-size:12.5px}
header .spacer{flex:1}
.vers{display:flex; gap:14px; flex-wrap:wrap}
.vers span{font-size:11px; color:var(--ink-3)}

/* honesty strip -- this is a prototype on injected data, and says so */
.caveat{
  background:var(--surface-2); border-bottom:1px solid var(--line);
  padding:9px 22px; font-size:12.5px; color:var(--ink-2);
}
.caveat b{color:var(--ink); font-weight:600}

/* ------------------------------------------------------------- summary row */
.summary{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px; background:var(--line); border-bottom:1px solid var(--line);
}
.stat{background:var(--surface); padding:12px 22px}
.stat .n{font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-size:24px; font-weight:600; line-height:1.1}
.stat .n small{font-size:13px; color:var(--ink-3); font-weight:500}

/* ------------------------------------------------------------------ layout */
/* Three panes, and they stay three. The rails shrink before the layout
   breaks, because the console is read by comparing them -- a station's health
   against its trace against the alert that fired. Stacked into one column that
   comparison is gone, so collapsing is reserved for genuinely phone-width
   screens. */
main{
  display:grid;
  grid-template-columns:minmax(170px,220px) minmax(0,1fr) minmax(230px,310px);
  gap:1px; background:var(--line); min-height:60vh;
}
@media (max-width:620px){ main{grid-template-columns:1fr} }
.pane{background:var(--surface); padding:14px 14px; min-width:0}

/* ------------------------------------------------------------ station rail */
.stn{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  border-radius:5px; padding:8px 9px; display:grid;
  grid-template-columns:3px 1fr auto; gap:9px; align-items:center;
  color:inherit; font:inherit; margin-bottom:2px;
}
.stn:hover{background:var(--surface-2)}
.stn[aria-current="true"]{background:var(--accent-soft)}
.stn:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.stripe{align-self:stretch; border-radius:2px; min-height:28px}
.stn .nm{font-weight:500; font-size:13px}
.stn .meta{font-size:11px; color:var(--ink-3)}
.chip{
  font-family:"Roboto Mono",ui-monospace,Consolas,monospace; font-size:9.5px; font-weight:600;
  letter-spacing:.04em; padding:2px 5px; border-radius:3px; white-space:nowrap;
  border:1px solid currentColor;
}
.h-HEALTHY{color:var(--ok)} .h-WATCH{color:var(--watch)}
.h-DEGRADING{color:var(--degrade)} .h-SUSPECT{color:var(--suspect)}
.h-FAILED{color:var(--failed)}
.bg-HEALTHY{background:var(--ok)} .bg-WATCH{background:var(--watch)}
.bg-DEGRADING{background:var(--degrade)} .bg-SUSPECT{background:var(--suspect)}
.bg-FAILED{background:var(--failed)}

.mapstrip{
  background:var(--surface); border-bottom:1px solid var(--line); padding:12px 22px;
}
.maphead{display:flex; align-items:baseline; gap:12px; margin-bottom:8px}
.maphint{font-size:11.5px; color:var(--ink-3)}
.maphead .ctl-lab{margin-left:0}
.maphead .ctl-lab:first-of-type{margin-left:auto}
.maphead .ctl{padding:3px 11px; font-size:11px}
.maplegend{
  display:flex; align-items:center; gap:7px; margin-top:7px;
  font-size:10.5px; color:var(--ink-3); font-family:"Roboto Mono",ui-monospace,Consolas,monospace;
}
.tilewarn{
  color:var(--degrade); border-left:3px solid var(--degrade);
  padding-left:9px; line-height:1.5; max-width:70ch;
}
.rampbar{
  height:9px; width:150px; border-radius:2px; border:1px solid var(--line);
}
.ctl.ghost{background:transparent; color:var(--accent)}
.ctl.ghost:hover{background:var(--accent-soft)}
#maps{display:flex; gap:22px; flex-wrap:wrap}
.mapbox{flex:1 1 300px; min-width:270px}
.mapbox h4{
  font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-size:11px; font-weight:700; margin:0 0 4px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
}
.mapbox canvas{border:1px solid var(--line); border-radius:5px; cursor:pointer}
#lmap{height:420px; border:1px solid var(--line); border-radius:5px; background:var(--surface-2)}
.mapattrib{font-size:10px; color:var(--ink-3); margin-top:4px; text-align:right}
.leaflet-container{font:inherit; background:var(--surface-2)}
.leaflet-tooltip{font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-size:11.5px}
.clockbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px 22px; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.clockbar .vnow{display:flex; align-items:baseline; gap:7px}
.clockbar #vnow{font-size:13px; font-weight:600}
#scrub{flex:1; min-width:160px; accent-color:var(--accent); cursor:pointer}
.ctl{
  font:inherit; font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-size:12px; font-weight:600;
  padding:5px 14px; border-radius:5px; cursor:pointer;
  border:1px solid var(--accent); background:var(--accent); color:#fff;
}
.ctl:hover{filter:brightness(1.08)}
.ctl:focus-visible,#scrub:focus-visible,.ctl-lab select:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}
.ctl-lab{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3)}
.ctl-lab select{
  font:inherit; font-size:11.5px; padding:3px 5px; border-radius:4px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  cursor:pointer;
}
#budget{width:100%; margin-top:6px; accent-color:var(--accent); cursor:pointer}
#budget:disabled{cursor:not-allowed; opacity:.45}
#state-filter{
  width:100%; margin-bottom:10px; padding:6px 8px; border-radius:5px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:inherit; font-size:12.5px; cursor:pointer;
}
#state-filter:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.state-head{
  display:flex; align-items:baseline; gap:8px; margin:12px 0 5px;
  padding-bottom:4px; border-bottom:1px solid var(--line);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-size:11px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
}
.state-head:first-child{margin-top:0}
.state-count{margin-left:auto; font-size:9.5px; font-weight:500; color:var(--ink-3);
  letter-spacing:0; text-transform:none}

/* ------------------------------------------------------------- chart stack */
.chan{border-top:1px solid var(--line); padding-top:12px; margin-top:14px}
.chan:first-of-type{border-top:0; margin-top:6px; padding-top:0}
.chan-head{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.chan-head .unit{font-size:11px; color:var(--ink-3)}
.chan-head .hc{margin-left:auto}
canvas{width:100%; display:block; touch-action:none}
.tip{
  position:absolute; top:4px; pointer-events:none; z-index:5;
  background:var(--surface); border:1px solid var(--line); border-radius:4px;
  padding:5px 7px; font-family:"Roboto Mono",ui-monospace,Consolas,monospace; font-size:10.5px;
  line-height:1.45; color:var(--ink); box-shadow:var(--shadow); white-space:nowrap;
}
.tip span{color:var(--ink-3)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-3); margin-top:5px}
.swatch{display:inline-block; width:16px; height:2px; vertical-align:middle; margin-right:5px}

/* ------------------------------------------------------------------ alerts */
.alert{
  width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line);
  border-left:3px solid var(--ink-3); border-radius:5px; padding:9px 11px;
  margin-bottom:7px; cursor:pointer; color:inherit; font:inherit;
}
.alert:hover{border-color:var(--accent)}
.alert:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.alert[aria-current="true"]{background:var(--accent-soft); border-color:var(--accent)}
.alert .top{display:flex; gap:8px; align-items:baseline; margin-bottom:3px}
.alert .lab{font-family:"Archivo","Segoe UI",system-ui,sans-serif; font-weight:600; font-size:12.5px}
.alert .when{margin-left:auto; font-size:10.5px; color:var(--ink-3)}
.alert p{margin:3px 0 0; font-size:12px; color:var(--ink-2); line-height:1.45}
.verdict{font-size:10px; padding:1px 5px; border-radius:3px; font-weight:600;
  font-family:"Roboto Mono",ui-monospace,Consolas,monospace}
.v-hit{background:var(--accent-soft); color:var(--accent)}
.v-miss{background:transparent; color:var(--suspect); border:1px solid currentColor}

/* --------------------------------------------------------------- inspector */
.bars{display:grid; gap:5px; margin-top:8px}
.bar{display:grid; grid-template-columns:88px 1fr 46px; gap:8px; align-items:center;
  font-size:11.5px}
.bar .track{height:9px; background:var(--surface-2); border-radius:2px; overflow:hidden}
.bar .fill{height:100%; background:var(--accent)}
.bar .v{text-align:right; color:var(--ink-2)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:12px; margin-top:8px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0; text-align:right}
.empty{color:var(--ink-3); font-size:12.5px; padding:20px 0; text-align:center}
footer{padding:14px 22px; border-top:1px solid var(--line); background:var(--surface);
  color:var(--ink-3); font-size:11.5px}

/* The application top bar, duplicated as markup rather than shared as a
   component. This page is static HTML built by dashboard/build.py and served
   outside the React bundle, so there is no component boundary to cross -- and
   twelve lines of duplication buy a way back to the rest of the product, which
   this page did not have. Fixed like the app's, with body padding-top set to
   exactly its height so nothing below it shifts. */
.appbar{
  position:fixed; inset:0 0 auto 0; z-index:1200; height:58px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 27px; gap:24px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.appbar .mark{
  display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-weight:700; font-size:18px; letter-spacing:-.02em;
}
.appbar .mark svg{display:block; flex:none}
.appbar nav{display:flex; align-items:center; gap:2px}
.appbar nav a{
  text-decoration:none; padding:6px 12px; font-size:13px; font-weight:500;
  color:var(--ink-2); border-bottom:2px solid transparent;
}
.appbar nav a:hover{color:var(--ink)}
.appbar nav a.active{color:var(--ink); border-bottom-color:#A2361F; font-weight:600}
body{padding-top:58px}

/* Leaflet ships its own Helvetica stack for its controls; bring them onto the
   same type as the rest of the page. Cosmetic only -- no geometry touched. */
.leaflet-container,
.leaflet-control-attribution,
.leaflet-bar a{font-family:"Archivo","Segoe UI",system-ui,sans-serif}

/* Collapsible region groups in the rail. <details> rather than a click handler:
   it is keyboard operable and screen-reader announced for free, and the open
   state survives a re-render of everything around it. */
.reg{border-bottom:1px solid var(--rule)}
.reg > summary{
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px;
  padding:7px 2px; font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2);
}
.reg > summary::-webkit-details-marker{display:none}
.reg > summary::before{
  content:"+"; font-family:"Roboto Mono",monospace; font-weight:400;
  color:var(--ink-3); width:9px; text-align:center;
}
.reg[open] > summary::before{content:"2"}
.reg > summary:hover{color:var(--ink)}
.reg > summary .state-count{margin-left:auto; text-transform:none; letter-spacing:0}
.reg-empty{
  padding:5px 2px 9px 19px; font-size:11.5px; color:var(--ink-3);
}
</style>

<div class="appbar">
  <a class="mark" href="/app/">
    <!-- Three readings, one adrift. The two steady channels inherit the bar's
         colour; the drifted one is always red. Matches web/src/App.tsx. -->
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="4.6" width="15" height="3.2" fill="currentColor"/>
      <rect x="6.8" y="10.4" width="15" height="3.2" fill="#E01B24"/>
      <rect x="2" y="16.2" width="15" height="3.2" fill="currentColor"/>
    </svg>
    <span>SkyGuard</span>
  </a>
  <nav>
    <a href="/app/board">Maintenance</a>
    <a href="/console/console.html" class="active">Network map</a>
  </nav>
</div>
<header>
  <div>
    <h1>SkyGuard Station Console</h1>
    <div class="sub">SIH 2026 &middot; PS26073 &middot; MoES / India Meteorological Department</div>
  </div>
  <div class="spacer"></div>
  <div class="vers mono" id="vers"></div>
</header>

<div class="caveat" id="caveat"></div>

<div class="clockbar" id="clockbar" hidden>
  <button id="playpause" class="ctl" aria-label="Play or pause replay">Play</button>
  <div class="vnow">
    <span class="lbl">Virtual time</span>
    <span class="mono" id="vnow">&mdash;</span>
  </div>
  <input id="scrub" type="range" min="0" max="1000" value="0"

  <label class="ctl-lab">Speed

      <option value="2208">all</option>

</div>

<div class="summary" id="summary"></div>

<section class="mapstrip" id="mapstrip">
  <div class="maphead">
    <span class="lbl">Network map</span>
    <span class="maphint" id="maphint"></span>
    <label class="ctl-lab">View
      <select id="mapview" aria-label="Map extent">
        <option value="basemap" selected>All India</option>
        <option value="regional">Fit to region</option>

      <select id="mapcolour" aria-label="What the dots show">

<script>
/*__LEAFLET_JS__*/

// NCMRWF's india_boundary layer, fetched from their GeoServer WFS and
// simplified to ~1.1 km (area change 0.011%). Embedded so the border
// still draws when no tile server is reachable -- and so the border that
// draws is the official one rather than something we invented.
const BOUNDARY = /*__BOUNDARY__*/null;

// Build-time substitution. dashboard/build.py replaces the token below with
// the contents of snapshot.json, producing console.html.
//
// Inlined rather than fetched because there is no fetch that would work: the
// artifact CSP blocks external hosts, and a file:// page cannot fetch its own
// siblings either. The page has to open by double-click AND publish as an
// artifact, and inlining is the only form that satisfies both.
//
// The `null` after the token keeps THIS file valid JavaScript, so the template
// opens in a browser instead of throwing a syntax error -- it renders the
// "no data" notice below rather than a blank page.
let DATA = /*__DATA__*/null;

// Real stations operated by India, with the observation-minus-background
// departures four forecast centres computed for them. See
// dashboard/export_wdqms.py for what this is and what it is not.
const WDQMS = /*__WDQMS__*/null;
let mapNetwork = "real";
let realMarks = [];

// Departures arrive in physical units, so one shared sigma scale would be
// meaningless across channels: 3 K is an enormous temperature error and 3 %
// relative humidity is nothing. These are the "clearly wrong" magnitude for
// each channel, used only to normalise the colour ramp.
const DEP_SCALE = {temp: 3, rh: 15, pres: 3};

// Live service if one is reachable, inlined snapshot if not.
//
// The API returns exactly the shape build.py inlines, so the two are
// interchangeable and nothing below this line knows the difference. That is
// deliberate: the console has to work on a projector with no network, and it
// has to show live data when there is one. Override with
// `window.SKYGUARD_API = "https://..."` before this script.
const API = (typeof window !== "undefined" && window.SKYGUARD_API) || "http://localhost:8000";
let LIVE = false;
let budget = 1/7;
let windowHours = 336;      // 14 days of trailing context, not the whole record
let poll = null;

async function load(b){
  const r = await fetch(
    `${API}/api/snapshot?budget=${b}&window_hours=${windowHours}`,
    {cache:"no-store"});
  if (!r.ok) throw new Error(`api ${r.status}`);
  return r.json();
}

async function clockPost(params){
  const q = new URLSearchParams(params).toString();
  const r = await fetch(`${API}/api/clock?${q}`, {method:"POST"});
  return r.ok ? r.json() : null;
}

const UNIT = {temp:"°C", rh:"%", pres:"hPa"};
const NAME = {temp:"Temperature", rh:"Relative humidity", pres:"Pressure"};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let current = DATA.stations[0].name;
let openAlert = null;

/* ------------------------------------------------------------------ header */
function banner(){
$("vers").innerHTML = Object.entries(DATA.versions)
  .map(([k,v]) => `<span>${esc(k)} <b style="color:var(--ink-2)">${esc(v)}</b></span>`).join("");

const real = DATA.alerts.filter(a => a.truth !== "(false alarm)").length;
$("caveat").innerHTML =
  `<b>Prototype on injected faults.</b> Every alert below carries its ground truth, `
  + `so the console shows its own misses rather than a curated demo. `
  + `${DATA.alerts.length} alerts over this window: ${real} on real injected faults, `
  + `${DATA.alerts.length - real} false. Budget is `
  + `${(DATA.alert_budget_per_station_day*7).toFixed(1)} alert per station per week.`
  + (LIVE
      ? ` <b style="color:var(--ok)">Live</b> from the API &mdash; the budget slider re-thresholds server-side.`
      : ` <b>Static snapshot</b> &mdash; no API reachable at <code>${esc(API)}</code>; showing the build-time export.`);

/* ----------------------------------------------------------------- summary */
const counts = {};
for (const s of DATA.stations) counts[s.health.station] = (counts[s.health.station]||0) + 1;
const ORDER = ["FAILED","SUSPECT","DEGRADING","WATCH","HEALTHY"];
$("summary").innerHTML = ORDER.map(k =>
  `<div class="stat"><div class="lbl">${k}</div>
   <div class="n h-${k}">${counts[k]||0}<small> / ${DATA.stations.length} stations</small></div></div>`
).join("") +
  `<div class="stat"><div class="lbl">Window</div>
   <div class="n mono" style="font-size:15px">${DATA.window[0].slice(0,10)}

  + `<div class="stat"><div class="lbl">Alert budget</div>
     <div class="n mono" style="font-size:15px" id="budget-val">

     <input id="budget" type="range" min="0.5" max="14" step="0.5"

/* ------------------------------------------------------------ station rail */
let stateFilter = "all";

function buildStateFilter(){
  const states = [...new Set(DATA.stations.map(s => s.state))].sort();
  $("state-filter").innerHTML =
    `<option value="all">All states &mdash; ${DATA.stations.length} stations</option>`
    + states.map(st => {
        const n = DATA.stations.filter(s => s.state === st).length;
        return `<option value="${esc(st)}"${st===stateFilter?" selected":""}>`
             + `${esc(st)} &mdash; ${n} stations</option>`;
      }).join("");
}
$("state-filter").onchange = (e) => {
  stateFilter = e.target.value;
  const visible = DATA.stations.filter(s => stateFilter === "all" || s.state === stateFilter);
  // Keep the selection if it is still visible; otherwise move to the first
  // station of the chosen state rather than showing an empty centre pane.
  if (!visible.some(s => s.name === current)) { current = visible[0].name; openAlert = null; }
  render();
  // Fitting to every station spans 1,700 km and is indistinguishable from the
  // all-India view, so the filter has to move the map itself to mean anything.
  if (stateFilter === "all") { if (map) map.setView([22.6, 80.0], 4); }
  else fitTo(visible.filter(s => s.latitude != null));
};

// The real network in the rail. Grouped by severity rather than by state:
// WDQMS carries no state field, and "what needs attention" is the grouping
// someone reading this list actually wants. Clicking flies the map to the
// station rather than selecting it -- there is no time series behind these, so
// the centre panes have nothing to show and pretending otherwise opens an empty
// pane.
function drawRailReal(){
  const rs = (WDQMS && WDQMS.stations) ? WDQMS.stations : [];
  const by = {};
  for (const x of rs) (by[x.region] ||= []).push(x);

  // Regions in a fixed geographic order, not alphabetical, so the list reads
  // down the country the way a map does and does not reshuffle when the counts
  // change.
  const ORDER = ["North", "North-East", "East", "Central", "West", "South",
                 "Antarctic stations"];
  const regions = ORDER.filter(r => by[r]);

  $("rail").innerHTML = regions.map(r => {
    const group = by[r].slice().sort((a, b) => b.health.severity - a.health.severity);
    const flagged = group.filter(x => x.health.state !== "OK");
    // Collapsed unless something in it is actually wrong. Opening all 346
    // stations at once is not a list, it is a wall -- and the point of the rail
    // is to be read from the top by someone deciding where to send a van.
    const open = flagged.some(x => x.health.state === "FAULT") ? " open" : "";
    return `<details class="reg"${open}>
      <summary>
        <span>${esc(r)}</span>
        <span class="state-count mono">${flagged.length
          ? flagged.length + " of " + group.length + " flagged"
          : "all " + group.length + " clear"}</span>
      </summary>` + (flagged.length ? flagged.map(x => `
        <button class="stn" data-lat="${x.latitude}" data-lon="${x.longitude}">
          <span class="stripe" style="background:${REAL_STATE[x.health.state]}"></span>
          <span><span class="nm">${esc(x.name)}</span>
            <div class="meta">${esc(x.health.channel)} &middot;
              ${x.health.severity}&times; tolerance${x.health.confident ? " &middot; centres agree" : ""}</div></span>
          <span class="chip" style="color:${REAL_STATE[x.health.state]};
            border-color:${REAL_STATE[x.health.state]}">${x.health.state}</span>
        </button>`).join("")
      : `<div class="reg-empty">every station within tolerance</div>`)
      + `</details>`;
  }).join("");

  $("rail").querySelectorAll(".stn").forEach(b => b.onclick = () => {
    // No time series exists behind a WDQMS station, so there is nothing for the
    // centre panes to show. Flying the map to it is the honest interaction.
    if (map) map.setView([+b.dataset.lat, +b.dataset.lon], 9);
  });
}
function drawRail(){
  if (mapNetwork === "real") return drawRailReal();
  // Grouped by state, always. The two regions are 1,700 km apart with nothing
  // in common meteorologically, and an alphabetical list interleaves them --
  // Guwahati, Jorhat, Mahabaleshwar -- which reads as one network when it is
  // two. The neighbour graph is built within a region, so the grouping is also
  // the boundary the detector actually works across.
  const shown = DATA.stations.filter(s => stateFilter === "all" || s.state === stateFilter);
  const byState = {};
  for (const s of shown) (byState[s.state] ||= []).push(s);

  $("rail").innerHTML = Object.keys(byState).sort().map(st => {
    const group = byState[st];
    const bad = group.filter(s => s.health.station !== "HEALTHY").length;
    return `<div class="state-head">
        <span>${esc(st)}</span>
        <span class="state-count mono">${bad ? bad + " need attention" : "all clear"}</span>
      </div>` + group.map(s => {
      const n = DATA.alerts.filter(a => a.station === s.name).length;
      return `<button class="stn" data-s="${esc(s.name)}" aria-current="${s.name===current}">
        <span class="stripe bg-${s.health.station}"></span>
        <span><span class="nm">${esc(s.name.replace(/_/g," "))}</span>
          <div class="meta">${s.elevation.toFixed(0)} m &middot; ${n} alert${n===1?"":"s"}</div></span>
        <span class="chip h-${s.health.station}">${s.health.station}</span>
      </button>`;
    }).join("");
  }).join("");

  $("rail").querySelectorAll(".stn").forEach(b =>
    b.onclick = () => { current = b.dataset.s; openAlert = null; render(); });
}

/* ------------------------------------------------------------------ charts */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function plot(cv, t, series, dseries, alerts, varname, sigma){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 132;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext("2d"); g.scale(dpr,dpr);
  g.clearRect(0,0,W,H);

  const PAD = {l:40, r:10, t:8, b:22};
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const vals = series.filter(v => v !== null);
  if (!vals.length){ g.fillStyle = css("--ink-3"); g.font = "11px 'IBM Plex Mono'";
    g.fillText("no data", PAD.l, H/2); return null; }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-6){ hi += .5; lo -= .5; }
  const pad = (hi-lo)*0.12; lo -= pad; hi += pad;
  const X = i => PAD.l + i/(series.length-1)*iw;
  const Y = v => PAD.t + (1-(v-lo)/(hi-lo))*ih;

  g.strokeStyle = css("--rule"); g.lineWidth = 1;
  for (let k = 0; k <= 4; k++){
    const y = Math.round(PAD.t + k/4*ih) + 0.5;
    g.beginPath(); g.moveTo(PAD.l, y); g.lineTo(PAD.l+iw, y); g.stroke();
  }

  g.fillStyle = css("--band");
  for (const a of alerts){
    if (a.variable !== varname) continue;
    const i0 = t.findIndex(x => x >= a.start.slice(0,16));
    let i1 = t.findIndex(x => x >= a.end.slice(0,16));
    if (i0 < 0) continue; if (i1 < 0) i1 = series.length-1;
    g.fillRect(X(i0), PAD.t, Math.max(X(i1)-X(i0), 2), ih);
  }

  g.strokeStyle = css("--line"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(PAD.l, PAD.t); g.lineTo(PAD.l, PAD.t+ih); g.stroke();
  g.fillStyle = css("--ink-3"); g.font = "10px 'IBM Plex Mono'"; g.textAlign = "right";
  g.fillText(hi.toFixed(1), PAD.l-5, PAD.t+8);
  g.fillText(((hi+lo)/2).toFixed(1), PAD.l-5, PAD.t+ih/2+3);
  g.fillText(lo.toFixed(1), PAD.l-5, PAD.t+ih);

  // Month ticks. A three-month window with no time axis forces the reader to
  // guess when anything happened, which is the first question an alert raises.
  // Tick granularity follows the window. Month ticks on a 48-hour view give
  // you one label or none, which is the same as no axis at all.
  const spanH = t.length * 3;
  const keyOf = spanH > 1500 ? (x) => x.slice(0,7)      // month
              : spanH > 200  ? (x) => x.slice(0,10)     // day
                             : (x) => x.slice(0,13);    // hour
  const fmt = spanH > 1500 ? {month:"short"}
            : spanH > 200  ? {day:"numeric", month:"short"}
                           : {hour:"2-digit", hour12:false};
  g.textAlign = "center";
  let lastMonth = "";
  let ticks = 0;
  for (let i = 0; i < t.length; i++){
    const m = keyOf(t[i]);
    if (m === lastMonth) continue;
    lastMonth = m;
    if (i === 0) continue;
    if (spanH <= 1500 && ++ticks % Math.max(1, Math.round(t.length/8/ (spanH>200?8:6))) !== 0
        && spanH > 200) continue;
    const x = X(i);
    g.strokeStyle = css("--line"); g.beginPath();
    g.moveTo(x, PAD.t); g.lineTo(x, PAD.t+ih); g.stroke();
    g.fillStyle = css("--ink-3");
    g.fillText(new Date(t[i].replace(" ","T")+"Z").toLocaleString("en", fmt),
               x, PAD.t+ih+13);
  }

  // The neighbour-difference residual, on its own symmetric scale, with the
  // +/-3 sigma band the detector actually uses. The band is the threshold --
  // showing the trace without it asks the reader to judge "is that a lot?"
  // with no reference.
  const dv = dseries.filter(v => v !== null);
  let dScale = null;
  if (dv.length){
    const m = Math.max(Math.max(...dv.map(Math.abs)), sigma*3.5) || 1;
    const mid = PAD.t + ih/2, half = ih*0.42;
    dScale = v => mid - (v/m)*half;
    for (const k of [3, -3]){
      const y = dScale(k*sigma);
      g.strokeStyle = css("--degrade"); g.globalAlpha = .45;
      g.setLineDash([3,3]); g.lineWidth = 1;
      g.beginPath(); g.moveTo(PAD.l, y); g.lineTo(PAD.l+iw, y); g.stroke();
      g.setLineDash([]); g.globalAlpha = 1;
    }
    g.strokeStyle = css("--trace-2"); g.lineWidth = 1; g.beginPath();
    let st = false;
    dseries.forEach((v,i) => {
      if (v === null){ st = false; return; }
      st ? g.lineTo(X(i), dScale(v)) : g.moveTo(X(i), dScale(v)); st = true;
    });
    g.stroke();
  }

  g.strokeStyle = css("--trace"); g.lineWidth = 1.6;
  g.lineJoin = "round"; g.beginPath();
  let started = false;
  series.forEach((v,i) => {
    if (v === null){ started = false; return; }
    started ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); started = true;
  });
  g.stroke();

  // Gaps are information, not absence. A dropout leaves a hole in the trace and
  // the hole is the fault, so it is marked rather than silently interpolated.
  g.fillStyle = css("--suspect");
  series.forEach((v,i) => {
    if (v !== null) return;
    g.fillRect(X(i)-1, PAD.t+ih-3, 2, 3);
  });

  return {X, Y, PAD, iw, ih, lo, hi, dScale};
}

// Crosshair readout. Values on a three-month trace are unreadable by eye; the
// question "what was it at 04:00 on the 12th" needs an answer without leaving
// the page.
function attachHover(cv, geo, t, series, dseries, unit){
  if (!geo) return;
  const tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true;
  cv.parentNode.style.position = "relative";
  cv.parentNode.appendChild(tip);

  function at(ev){
    const r = cv.getBoundingClientRect();
    const x = ev.clientX - r.left;
    const i = Math.round((x - geo.PAD.l) / geo.iw * (series.length-1));
    if (i < 0 || i >= series.length){ tip.hidden = true; return; }
    const v = series[i], d = dseries[i];
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(geo.X(i), 4), r.width-150) + "px";
    tip.innerHTML = `<b>${t[i]}</b><br>${v === null ? "no reading"
      : v.toFixed(1) + " " + unit}<br><span>vs neighbours `
      + `${d === null ? "n/a" : (d >= 0 ? "+" : "") + d.toFixed(2)}</span>`;
  }
  cv.addEventListener("pointermove", at);
  cv.addEventListener("pointerleave", () => { tip.hidden = true; });
}

/* --------------------------------------------------------------------- map */
//
// Leaflet, with the same two sources NCMRWF uses on its own operational
// dashboard (nwp.ncmrwf.gov.in) -- verified by reading its network traffic:
//
//   basemap   Esri World Imagery, satellite photography. It carries NO drawn
//             boundaries at all, so there are none to get wrong. Confirmed by
//             fetching a tile over Kashmir: terrain and snow, not one line.
//   boundary  ncmrwf:india_boundary from NCMRWF's own GeoServer -- the official
//             Government of India depiction, served by a Ministry of Earth
//             Sciences body.
//
// That pairing is the answer to a problem with no other clean solution.
// Boundary depiction on Indian maps is regulated, and a community-mapped
// rendering of Jammu & Kashmir or Aksai Chin on a screen shown to MoES is a
// problem no accuracy number recovers from. NCMRWF appear to have reached the
// same conclusion; we are copying their homework, and saying so.
//
// Leaflet is VENDORED, not loaded from a CDN. The published artifact runs under
// a CSP that blocks every external host, so a CDN import would leave a blank
// rectangle for anyone opening the shared link. Same reason the boundary is
// also embedded as simplified GeoJSON: when no tile server is reachable the map
// still draws the coastline and the border from an official source.

let map = null, stationLayer = null, edgeLayer = null, boundaryLayer = null;
let mapColour = "temp";
let tilesOK = null;
let TILE_TPL = null, BND_TPL = null;

// Divergence from neighbours in sigma, at the latest sample in view. Signed on
// purpose: "warmer than its neighbours" and "colder than its neighbours" are
// different faults and an absolute value throws that away.
function divergence(s, varname){
  const d = s.series && s.series["d_" + varname];
  if (!d) return null;
  for (let i = d.length - 1; i >= 0; i--)
    if (d[i] !== null) return d[i] / ((s.sigma || {})[varname] || 1);
  return null;
}

// Blue below, paper in the middle, orange above -- the palette's own ink and
// alert colours, so the map stays in the same visual language as the traces
// rather than importing a rainbow.
// Saturated ends and a white centre. The paper-toned ramp used on the charts
// is unreadable over satellite imagery -- mid greens and browns swallow a pale
// fill, and the whole point of the map is that a diverging station is obvious
// at a glance. White reads as "agrees with its neighbours" against any
// background, and the two ends are far enough apart to tell sign at speed.
function rampColour(z){
  if (z === null || !isFinite(z)) return "#FFFFFF";
  const t = Math.max(-1, Math.min(1, z / 3));
  // The STRUCTURE of this ramp is unchanged and the reasoning above still
  // holds: a pale centre and two saturated ends is the only thing that stays
  // readable over both desert and forest. Only the hues moved, out of the
  // stock blue/orange and into the product's own teal-to-oxide, so the map
  // belongs to the same object as the rest of the interface. Both ends are
  // still dark enough to hold against imagery, and the centre is paper rather
  // than pure white.
  const mid = [255, 255, 255];
  const end = t < 0 ? [29, 111, 224] : [224, 27, 36];
  const k = Math.abs(t);
  return "rgb(" + mid.map((m, i) => Math.round(m + (end[i] - m) * k)).join(",") + ")";
}

// Station colours. These fill the dot; there is no longer a health ring.
// Matching the --ok/--watch/--degrade/--suspect/--failed scale in :root. The
// previous set was neon (#12C08A mint, #FFC93D yellow, #FF5A5A pink) and
// predates the chart-paper palette -- five saturated dots on satellite imagery
// read as a warning about the map rather than about any station. Same five
// steps at ink weight: calm green through ochre to deep oxide, so severity
// reads as a ramp and only the worst state is loud.
// Three colours out of red / green / blue / white / black, and that is all the
// map uses. Green is deliberately not among them: the basemap is satellite
// imagery, mostly vegetation, and a green dot on green terrain is the one
// combination that reliably disappears. White carries "nothing to see here",
// blue "worth a look", red "wrong".
const HEALTH_RING = {HEALTHY:"#FFFFFF", WATCH:"#1D6FE0", DEGRADING:"#1D6FE0",
                     SUSPECT:"#E01B24", FAILED:"#E01B24"};
const REAL_STATE_C = {OK:"#FFFFFF", WATCH:"#1D6FE0", FAULT:"#E01B24"};

// The real network gets three states and, in effect, two colours: a station
// that is fine is drawn in ink at low opacity and carries no hue at all, so
// every coloured dot on the map is a dot worth looking at. Five graded hues at
// three pixels across were indistinguishable, which is the whole reason 346
// stations looked identical.
const REAL_STATE = REAL_STATE_C;
const REAL_ORDER = {OK:0, WATCH:1, FAULT:2};

// Band a severity the same way the exporter does, so the map can grade a single
// channel when one is selected instead of always using the worst.
function bandOf(z){ return z < 2 ? "OK" : z < 5 ? "WATCH" : "FAULT"; }

async function probeTiles(){
  if (!LIVE){ tilesOK = false; return false; }
  try {
    const r = await fetch(`${API}/api/tiles/status`, {cache:"no-store"});
    const j = await r.json();
    tilesOK = !!j.available;
    // The server tells us the tile path, fingerprinted by source. We never
    // build it ourselves -- that is how the browser ended up caching an
    // obsolete basemap for a year at a URL that had not changed.
    TILE_TPL = j.tile_template || "/api/tiles/{z}/{x}/{y}.png";
    BND_TPL  = j.boundary_template || "/api/boundary/{z}/{x}/{y}.png";
    return tilesOK;
  } catch { tilesOK = false; return false; }
}

// 346 dots on an all-India view is a crowd; the same dots at district zoom are
// specks. Radius therefore tracks the zoom level, and severity multiplies it,
// so the handful that matter stay findable when everything else is small and
// the map looks neither congested nor empty at any zoom.
function realRadius(state){
  const z = map ? map.getZoom() : 4;
  const base = z <= 4 ? 3.0 : z <= 5 ? 3.8 : z <= 6 ? 4.8 : z <= 7 ? 6.0 : 7.4;
  // Size and colour say the same thing, deliberately. Two channels carrying one
  // fact is what lets a flagged station be picked out of three hundred at a
  // glance, and it keeps the map readable for anyone who cannot separate amber
  // from oxide.
  const k = state === "FAULT" ? 1.9 : state === "WATCH" ? 1.35 : 0.62;
  return +(base * k).toFixed(2);
}

// The line above the map, which must not describe a neighbour graph on the
// network that has none.
function setHint(){
  const el = $("maphint");
  if (!el) return;
  el.innerHTML = mapNetwork === "real"
    ? "Real stations operated by India, from WMO's quality monitoring. Colour is "
      + "how far each sat from four forecast centres' background."
    : "Lines are the neighbour graph &mdash; who each station is compared against. "
      + "A fault moves one dot; weather moves the cluster.";
}

function legendHTML(){
  if (mapNetwork === "real"){
    const w = WDQMS || {};
    const key = mapColour === "health" ? null : mapColour;
    const n = {OK:0, WATCH:0, FAULT:0};
    for (const st of (w.stations || [])){
      if (key && !(st.dep && st.dep[key])) continue;
      n[key ? bandOf(st.dep[key].z) : st.health.state]++;
    }
    const what = key
      ? {temp:"temperature", rh:"humidity", pres:"pressure"}[key] + " departure"
      : "worst channel";
    const swatch = st =>
      `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:11px">
         <span style="width:${st === "FAULT" ? 11 : st === "WATCH" ? 8 : 5}px;
           height:${st === "FAULT" ? 11 : st === "WATCH" ? 8 : 5}px;border-radius:50%;
           background:${REAL_STATE[st]};${st === "OK" ? "opacity:.45" : ""}"></span>${st.toLowerCase()} ${n[st]}</span>`;
    return `<div class="maplegend">
      ${["FAULT","WATCH","OK"].map(swatch).join("")}
      <span style="margin-left:2px">graded on ${esc(what)} vs
        ${esc((w.centres || []).join("/"))} &middot; ${esc(String(w.date || ""))}
        &middot; a screen, not the fault engine &mdash; see the board</span>
    </div>`;
  }
  if (mapColour === "health")
    return `<div class="maplegend">Dot colour: sensor health</div>`;
  const u = {temp:"temperature", rh:"humidity", pres:"pressure"}[mapColour];
  return `<div class="maplegend">
    <span>&minus;3&sigma; below</span>
    <span class="rampbar" style="background:linear-gradient(90deg,
      ${rampColour(-3)}, ${rampColour(0)}, ${rampColour(3)})"></span>
    <span>+3&sigma; above</span>
    <span style="margin-left:10px">fill = ${esc(u)} vs neighbours now
      &middot; health in the tooltip</span>
  </div>`;
}

const HEALTH_COLOUR = {HEALTHY:"ok", WATCH:"watch", DEGRADING:"degrade",
                       SUSPECT:"suspect", FAILED:"failed"};

function renderMaps(){
  const shown = DATA.stations.filter(s =>
    (stateFilter === "all" || s.state === stateFilter) && s.latitude != null);

  // Rebuild from scratch if the tile availability changed since last time.
  if (map && map._skyguardTiles !== tilesOK){ map.remove(); map = null; }
  if (!map){
    $("maps").innerHTML =
      `<div class="mapbox" style="flex:1 1 100%">
         <div id="lmap"></div>
         <div class="mapattrib" id="mapattrib"></div>
       </div>` ;
    // zoomAnimation off, deliberately. With it on, setView and fitBounds were
    // silently swallowed: Leaflet's _tryAnimatedZoom claims the move and hands
    // it to a CSS transition that never runs here, so no view change happened
    // and no event fired -- the state filter appeared to do nothing. _resetView
    // works correctly, which is the path taken when animation is disabled. An
    // instant view change is fine on a dashboard; a filter that does nothing is
    // not.
    map = L.map("lmap", {
      zoomControl:true, attributionControl:false,
      zoomAnimation:false, fadeAnimation:false,
      // The world repeated infinitely: panning east past the dateline just kept
      // drawing India again, forever, because Leaflet wraps longitude by
      // default. Verified before the fix by setting the view to longitude 440
      // and finding twelve tiles still rendering. maxBounds stops the drag at
      // the edge; noWrap on the tile layers stops the copies existing at all.
      // The box is generous enough to include MAITRI and BHARATI, since the
      // rail can fly the map to them.
      maxBounds: L.latLngBounds([[-75, 5], [40, 100]]),
      maxBoundsViscosity: 0.85,
      // A wheel notch used to be a whole zoom level, which overshoots the
      // country in two clicks. Half-steps, and about twice the wheel distance
      // per level, so zooming is something you can aim.
      zoomSnap: 0.5, zoomDelta: 0.5, wheelPxPerZoomLevel: 170,
    }).setView([22.6, 80.0], 4);
    map._skyguardTiles = tilesOK;

    if (tilesOK){
      // Through our own proxy: same origin, disk-cached, so the map keeps
      // drawing after the venue wifi dies.
      L.tileLayer(API + TILE_TPL,
                  {maxZoom:12, minZoom:3, crossOrigin:true, noWrap:true}).addTo(map);
      boundaryLayer = L.tileLayer(API + BND_TPL,
                  {maxZoom:12, minZoom:3, opacity:0.9, noWrap:true}).addTo(map);
      $("mapattrib").innerHTML =
        "Imagery &copy; Esri, Maxar, Earthstar Geographics &middot; "
        + "Boundary &copy; NCMRWF, Ministry of Earth Sciences";
    } else {
      // No tile server reachable -- the published artifact, or no network.
      // The embedded boundary is the same NCMRWF layer, simplified, so even
      // offline the border shown is the official one.
      if (typeof BOUNDARY !== "undefined" && BOUNDARY){
        boundaryLayer = L.geoJSON(BOUNDARY, {
          style:{color:"#243FA8", weight:1, fill:true,
                 fillColor:"#EDF1F7", fillOpacity:1}}).addTo(map);
      }
      $("mapattrib").innerHTML =
        "Boundary &copy; NCMRWF, Ministry of Earth Sciences (simplified) "
        + "&middot; no basemap: tiles need the API running";
    }
    map.on("click", () => {});
  }

  if (edgeLayer) map.removeLayer(edgeLayer);
  if (stationLayer) map.removeLayer(stationLayer);

  // The real network. 346 stations operated by India, coloured by how far each
  // one sat from four forecast centres' background yesterday.
  //
  // No neighbour edges are drawn here. WDQMS publishes no neighbour graph, and
  // deriving one from distance would be inventing structure and then drawing it
  // as though it were given. The simulated network keeps its edges because its
  // graph is a real part of that dataset.
  if (mapNetwork === "real"){
    const rs = (WDQMS && WDQMS.stations) ? WDQMS.stations : [];
    const key = mapColour === "health" ? null : mapColour;
    const unit = {temp:"K", rh:"%", pres:"hPa"};

    // Grade by the channel being shown, not always by the worst one. Sizing a
    // dot from the worst channel while colouring it from the selected one drew
    // a station large for bad pressure and neutral for fine temperature, in the
    // same dot -- two encodings disagreeing inside one shape.
    const graded = (key ? rs.filter(x => x.dep && x.dep[key]) : rs).map(x => {
      const d = key ? x.dep[key] : x.dep[x.health.channel];
      const z = key ? d.z : x.health.severity;
      return {s: x, d, z, k: key || x.health.channel, state: key ? bandOf(z) : x.health.state};
    });

    // Worst painted LAST so it lands on top. With 346 overlapping dots the
    // painter's order decides what an operator can see at all, and a flagged
    // station must never end up underneath a healthy neighbour.
    graded.sort((a, b) => (REAL_ORDER[a.state] - REAL_ORDER[b.state]) || (a.z - b.z));

    realMarks = graded.map(g => {
      const ok = g.state === "OK";
      const m = L.circleMarker([g.s.latitude, g.s.longitude], {
        radius: realRadius(g.state),
        fillColor: REAL_STATE[g.state],
        // A station that is fine recedes: no hue, half opacity, no casing. The
        // casing exists to separate a coloured dot from the imagery, and an
        // uncoloured one has nothing to separate.
        // No border on any dot. A casing was there to separate a fill from the
        // imagery, but with white / blue / red the fills carry themselves, and
        // 346 outlined discs read as a mesh rather than as points.
        fillOpacity: ok ? 0.55 : 0.95,
        stroke: false,
      });
      const u = unit[g.k] || "";
      m.bindTooltip(
        `<b>${esc(g.s.name)}</b> &mdash; ${g.state}`
        + `<br>${esc(g.k)} ${(g.d.mean >= 0 ? "+" : "")}${g.d.mean} ${u} vs background`
        + `<br>${g.z}&times; the ${u} tolerance for this channel`
        + (g.d.spread != null
            ? `<br>spread ${g.d.spread} ${u} over ${g.d.n} obs, ${g.d.centres} centres` : "")
        + (g.s.health.confident ? "<br>all four centres agree" : "")
        + (g.s.in_india ? "" : "<br><b>Antarctic station</b>"),
        {direction:"top", offset:[0,-5]});
      m._state = g.state;
      return m;
    });
    stationLayer = L.layerGroup(realMarks).addTo(map);

    // Resize on zoom rather than rebuilding: 346 markers is enough that tearing
    // them down and re-binding 346 tooltips on every wheel notch shows up as a
    // stutter. Hooked once per map instance.
    if (!map._skyguardZoomHook){
      map._skyguardZoomHook = true;
      map.on("zoomend", () => {
        for (const m of realMarks) m.setRadius(realRadius(m._state));
      });
    }
    setHint();
    const leg0 = document.querySelector(".maplegend");
    if (leg0) leg0.outerHTML = legendHTML(); else $("maps").insertAdjacentHTML("beforeend", legendHTML());
    setTimeout(() => map.invalidateSize(), 40);
    return;
  }

  // Switching away from the real network leaves realMarks holding markers that
  // are no longer on the map, and the zoomend hook goes on resizing them on
  // every wheel notch forever. Cheap to leak, pointless to keep.
  realMarks = [];

  // Neighbour edges: who each station is compared against. This is the reason
  // the map exists -- an excursion at one dot with its neighbours calm is a
  // fault; the whole cluster moving together is weather.
  const drawn = new Set(), edges = [];
  for (const s of shown){
    for (const nb of (DATA.neighbours[s.name] || [])){
      const o = shown.find(q => q.name === nb);
      if (!o) continue;
      const k = [s.name, nb].sort().join("|");
      if (drawn.has(k)) continue;
      drawn.add(k);
      // drawn twice: a white casing under a dark core, so the graph is legible
      // over both bright desert and dark forest
      edges.push(L.polyline([[s.latitude, s.longitude], [o.latitude, o.longitude]],
                            {color:"#FCF9F2", weight:3, opacity:0.5}));
    }
  }
  const cores = [];
  for (const s of shown){
    for (const nb of (DATA.neighbours[s.name] || [])){
      const o = shown.find(q => q.name === nb);
      if (o) cores.push(L.polyline([[s.latitude,s.longitude],[o.latitude,o.longitude]],
                {color:"#171A1E", weight:1, opacity:0.5}));
    }
  }
  edgeLayer = L.layerGroup(edges.concat(cores)).addTo(map);

  // No separate halo layer any more. It was a white disc of radius up to 12.5
  // behind a 9px dot with a 3.5px ring -- three concentric shapes per station,
  // which on a ten-station map reads as clutter rather than as data. A 2px pale
  // casing STROKE on the dot itself does the same job (a light fill no longer
  // vanishes over desert, a dark one no longer vanishes over forest) in one
  // shape instead of two, and halves the layers Leaflet has to keep.

  const marks = shown.map(s => {
    const st = s.health.station;
    const hcol = HEALTH_RING[st] || "#888";
    const z = mapColour === "health" ? null : divergence(s, mapColour);
    const sel = s.name === current;
    const m = L.circleMarker([s.latitude, s.longitude], {
      // One uniform size. Radius used to carry health as well as colour, so a
      // healthy station was 7px and a failed one 9px -- too small a difference
      // to read deliberately, big enough to make the map look uneven. Colour
      // carries health; selection is the only thing that changes size.
      radius: sel ? 7 : 5.5,
      // Fill is the LIVE divergence in a channel mode, and the STICKY health
      // in health mode. These remain different objects -- one bad hour must
      // never turn a station red -- so whichever one the fill is NOT showing is
      // named in the tooltip instead. They are never merged into one colour.
      fillColor: mapColour === "health" ? hcol : rampColour(z),
      fillOpacity: 1,
      // Only the selected station carries a ring, and it is black. Everything
      // else is a bare fill.
      stroke: sel,
      color: "#000000",
      weight: sel ? 2.5 : 0,
    });
    const nm = s.name.replace(/_/g, " ");
    // Health is named in the tooltip because in divergence mode the fill shows
    // divergence instead, and dropping the ring must not drop the information.
    m.bindTooltip(z === null ? `${nm}<br>${st}`
        : `${nm}<br>${(z>=0?"+":"")}${z.toFixed(1)}\u03c3 vs neighbours<br>${st}`,
      {direction:"top", offset:[0,-7]});
    m.on("click", () => { current = s.name; openAlert = null; render(); });
    return m;
  });
  stationLayer = L.layerGroup(marks).addTo(map);

  setHint();
  const leg = document.querySelector(".maplegend");
  if (leg) leg.outerHTML = legendHTML(); else $("maps").insertAdjacentHTML("beforeend", legendHTML());
  setTimeout(() => map.invalidateSize(), 40);
}

function fitTo(group){
  if (!map || !group.length) return;
  map.fitBounds(L.latLngBounds(group.map(s => [s.latitude, s.longitude])),
                {padding:[40,40], maxZoom:8});
}

/* ------------------------------------------------------------------ render */
function render(){
  drawRail();
  if (!$("mapstrip").dataset.hidden) renderMaps();
  const s = DATA.stations.find(x => x.name === current);
  const mine = DATA.alerts.filter(a => a.station === current);

  $("stn-name").textContent = s.name.replace(/_/g," ");
  $("stn-meta").textContent =
    `${s.elevation.toFixed(0)} m · ${s.longitude.toFixed(2)}°E · `
    + `neighbours ${(DATA.neighbours[s.name]||[]).join(", ").replace(/_/g," ")}`;

  // In static mode the series carries the whole record, so the window is
  // applied here instead of by the server.
  const S = LIVE ? s.series : (() => {
    const n = Math.max(2, Math.round(windowHours / 3));
    const out = {t: s.series.t.slice(-n)};
    for (const v of ["temp","rh","pres"]){
      out[v] = s.series[v].slice(-n);
      out["d_"+v] = s.series["d_"+v].slice(-n);
    }
    return out;
  })();

  $("channels").innerHTML = ["temp","rh","pres"].map(v => `
    <div class="chan">
      <div class="chan-head">
        <h3 style="font-size:13px">${NAME[v]}</h3>
        <span class="unit mono">${UNIT[v]}</span>
        <span class="chip hc h-${s.health.by_variable[v]}">${s.health.by_variable[v]}</span>
      </div>
      <canvas id="cv-${v}"></canvas>
    </div>`).join("") + `
    <div class="legend">
      <span><i class="swatch" style="background:var(--trace)"></i>observed</span>
      <span><i class="swatch" style="background:var(--trace-2)"></i>difference from neighbours</span>
      <span><i class="swatch" style="background:var(--band);height:9px"></i>flagged window</span>
      <span><i class="swatch" style="background:var(--degrade)"></i>&plusmn;3&sigma; alert threshold</span>
    </div>`;

  for (const v of ["temp","rh","pres"]){
    const geo = plot($("cv-"+v), S.t, S[v], S["d_"+v],
                     mine, v, (s.sigma||{})[v] || 1);
    attachHover($("cv-"+v), geo, S.t, S[v], S["d_"+v], UNIT[v]);
  }

  $("alerts").innerHTML = mine.length ? mine.map((a,i) => {
    const hit = a.label === a.truth;
    return `<button class="alert" data-i="${i}" aria-current="${openAlert===i}"
      style="border-left-color:var(--${a.label==='genuine_weather'?'ok':'suspect'})">
      <span class="top">
        <span class="lab">${esc(a.label.replace(/_/g," "))}</span>
        <span class="verdict ${hit?'v-hit':'v-miss'}">${hit?"correct":"truth: "+esc(a.truth)}</span>
        <span class="when mono">${esc(a.start.slice(5,16))}</span>
      </span>
      <p>${esc(a.explanation)}</p>
    </button>`;
  }).join("") : `<div class="empty">No open alerts at this station.</div>`;

  $("alerts").querySelectorAll(".alert").forEach(b =>
    b.onclick = () => { openAlert = +b.dataset.i; render(); });

  // inspector
  const a = openAlert !== null ? mine[openAlert] : null;
  $("inspector").innerHTML = !a
    ? `<div class="empty">Select an alert to see why it fired.</div>`
    : (() => {
        const c = Object.entries(a.contributions).sort((x,y) => Math.abs(y[1])-Math.abs(x[1]));
        const max = Math.max(...c.map(([,v]) => Math.abs(v))) || 1;
        const tpl = Object.entries(a.template_scores).sort((x,y) => y[1]-x[1]).slice(0,3);
        return `
        <div style="font-family:"Archivo","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:14px">
          ${esc(a.label.replace(/_/g," "))}
          <span class="mono" style="font-size:11px;color:var(--ink-3)">
            confidence ${a.confidence.toFixed(2)}</span>
        </div>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(a.explanation)}</p>
        <div class="lbl" style="margin:14px 0 2px">Why the score fired</div>
        <div class="bars">${c.map(([k,v]) => `
          <div class="bar"><span class="mono">${esc(k)}</span>
            <span class="track"><span class="fill" style="width:${Math.abs(v)/max*100}%"></span></span>
            <span class="v mono">${(v*100).toFixed(0)}%</span></div>`).join("")}</div>
        <div class="lbl" style="margin:14px 0 2px">Competing signatures</div>
        <div class="bars">${tpl.map(([k,v]) => `
          <div class="bar"><span class="mono">${esc(k)}</span>
            <span class="track"><span class="fill" style="width:${v*100}%"></span></span>
            <span class="v mono">${v.toFixed(2)}</span></div>`).join("")}</div>
        <dl class="kv mono">
          <dt>duration</dt><dd>${a.duration_h} h</dd>
          <dt>conformal p</dt><dd>${a.p_value.toExponential(1)}</dd>
          <dt>coherence</dt><dd>${(a.descriptors.coherence*100).toFixed(0)}%</dd>
          <dt>ground truth</dt><dd>${esc(a.truth)}</dd>
        </dl>`;
      })();
}

$("foot").innerHTML =
  `Generated from <span class="mono">${esc(DATA.generated_from)}</span>. `
  + `Neighbours are selected by lowest difference-sigma, not by distance or cluster label. `
  + `Health is the worst of the three channels, never the mean.`;

async function boot(){
  try {
    const live = await load(budget);
    DATA = live; LIVE = true;
    // Probe BEFORE the first render. renderMaps() builds its layers once,
    // guarded by `if (!map)`, so if it runs while tilesOK is still null it
    // commits to the offline branch and never picks up the basemap.
    await probeTiles();
  } catch (err) {
    // Not an error worth shouting about -- the static build is a supported
    // mode, not a degraded one. It is labelled so nobody mistakes a frozen
    // snapshot for a live feed.
    LIVE = false;
    if (!DATA) return;
  }
  start();
}

async function refresh(b){
  if (!LIVE) return;
  budget = b;
  DATA = await load(b);
  banner(); buildStateFilter(); syncClock(); render();
}

function wireClock(){
  // The window selector is useful in BOTH modes -- a static three-month trace
  // is just as unreadable as a live one -- so the bar always shows, and only
  // the replay controls disappear when there is no server to replay on.
  $("clockbar").hidden = false;
  for (const id of ["playpause", "scrub", "speed"]){
    const el = $(id);
    el.disabled = !LIVE;
    el.closest("label") ? (el.closest("label").style.display = LIVE ? "" : "none")
                        : (el.style.display = LIVE ? "" : "none");
  }
  $("vnow").parentNode.style.display = LIVE ? "" : "none";

  if (!LIVE){
    // Client-side tail, since there is no server to ask for a slice.
    $("winsel").onchange = (e) => { windowHours = +e.target.value; render(); };
    return;
  }

  $("playpause").onclick = async () => {
    const c = await clockPost({playing: !(DATA.clock && DATA.clock.playing)});
    if (c) { DATA.clock = c; syncClock(); tick(); }
  };
  $("speed").onchange = async (e) => {
    const c = await clockPost({speed: e.target.value});
    if (c) { DATA.clock = c; syncClock(); }
  };
  $("scrub").oninput = () => { $("scrub").dataset.dragging = "1"; };
  $("scrub").onchange = async (e) => {
    delete $("scrub").dataset.dragging;
    const c = await clockPost({seek: (+e.target.value)/1000});
    if (c) { DATA.clock = c; await refresh(budget); }
  };
  $("winsel").onchange = async (e) => {
    windowHours = +e.target.value;
    await refresh(budget);
  };
  syncClock();
}

function syncClock(){
  const c = DATA.clock;
  if (!c) return;
  $("vnow").textContent = c.now.slice(0,16).replace("T"," ");
  $("playpause").textContent = c.playing ? "Pause" : "Play";
  if (!$("scrub").dataset.dragging)
    $("scrub").value = Math.round(c.progress * 1000);
}

// Poll while playing. Two seconds is the honest cadence: the server recomputes
// what it can see at the new virtual instant, and a faster poll would spend
// bandwidth redrawing a chart that has moved by a pixel.
function tick(){
  clearInterval(poll);
  if (!LIVE || !(DATA.clock && DATA.clock.playing)) return;
  poll = setInterval(async () => {
    if (!DATA.clock.playing) { clearInterval(poll); return; }
    try { DATA = await load(budget); banner(); syncClock(); render(); }
    catch { clearInterval(poll); }
  }, 2000);
}

function start(){
  banner();
  buildStateFilter();
  wireClock();
  $("mapview").onchange = (e) => {
    if (e.target.value === "regional"){
      // MAITRI and BHARATI are India's Antarctic stations. They are real and
      // they stay on the map, but fitting the bounds to them zooms the view out
      // to show the South Pole, which looks like a broken map rather than like
      // two research bases.
      if (mapNetwork === "real")
        fitTo((WDQMS && WDQMS.stations ? WDQMS.stations : []).filter(s => s.in_india));
      else
        fitTo(DATA.stations.filter(s =>
          (stateFilter === "all" || s.state === stateFilter) && s.latitude != null));
    }
    else if (map) map.setView([22.6, 80.0], 4);
  };
  $("mapcolour").onchange = (e) => { mapColour = e.target.value; renderMaps(); };
  $("mapnetwork").onchange = (e) => {
    mapNetwork = e.target.value;
    // Health applies to BOTH networks now: the real one is screened from its
    // WDQMS departures in dashboard/export_wdqms.py. It is also the default
    // there, because a diverging ramp puts its palest colour on the stations
    // nearest zero -- exactly the ones that are fine -- which makes the faulty
    // handful the hardest thing on the map to see. Solid health colours invert
    // that: the eye lands on the eight failed stations first.
    const csel = $("mapcolour");
    if (mapNetwork === "real"){ mapColour = "health"; csel.value = "health"; }
    renderMaps();
    drawRail();
  };
  $("mapnetwork").dispatchEvent(new Event("change"));
  $("maptoggle").onclick = () => {
    const strip = $("mapstrip");
    const hidden = !strip.dataset.hidden;
    if (hidden){ strip.dataset.hidden = "1"; $("maps").style.display = "none"; }
    else { delete strip.dataset.hidden; $("maps").style.display = ""; renderMaps(); }
    $("maptoggle").textContent = hidden ? "Show" : "Hide";
    $("maptoggle").setAttribute("aria-expanded", String(!hidden));
  };
  if (!DATA.stations.some(s => s.name === current)) current = DATA.stations[0].name;
  render();
  addEventListener("resize", render);
}

if (!DATA) {
  document.body.innerHTML =
    '<p style="font:15px/1.6 system-ui;padding:40px;max-width:38em;color:#161C33">'
    + '<b>This is the template, not the console.</b><br>It carries no data. '
    + 'Run <code>python -m dashboard.build</code> and open '
    + '<code>dashboard/console.html</code> instead.</p>';
} else {
  boot();
}
</script>
