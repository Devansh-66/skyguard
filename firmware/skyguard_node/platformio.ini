; The sketch lives at the project root, not in src/, because Wokwi's own web
; IDE and the Arduino IDE both expect it beside diagram.json. Pointing
; PlatformIO here keeps one copy of the firmware instead of two that drift.
[platformio]
src_dir = .

; Build for the Wokwi simulator. Same firmware runs on real hardware.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^6.21.5
