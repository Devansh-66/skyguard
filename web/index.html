<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SkyGuard — automatic weather station integrity monitoring." />
    <meta name="theme-color" content="#F7F2E7" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <!-- One grotesque and one mono, no serif. Archivo has a genuinely tight
         uppercase and holds up small, which is what an interface made of
         engraved labels needs; Roboto Mono carries every number with tabular
         figures. Both have real fallback stacks, so a machine with no route to
         Google Fonts degrades to system faces rather than to invisible text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>SkyGuard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
