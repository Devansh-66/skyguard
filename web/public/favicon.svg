    <circle cx="13" cy="17" r="6.4"/>
    <path d="M17.6 12.4 L26.4 3.6"/>
    <path d="M26.4 3.6 L23.2 2.4 M23.8 6.2 L20.6 5"/>
  </g>
</svg>
